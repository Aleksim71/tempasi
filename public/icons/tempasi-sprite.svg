<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <!-- Tempasi header icons (dark header variant) -->
    <!-- Stable: no currentColor, no masks/patterns -->

    <!-- Profile -->
    <symbol id="tp-header-profile" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" fill="none" stroke="#E7C86A" stroke-width="2"/>
      <path d="M4 20c0-4 4-6 8-6s8 2 8 6"
            fill="none" stroke="#E7C86A" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Cart -->
    <symbol id="tp-header-cart" viewBox="0 0 24 24">
      <path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"
            fill="none" stroke="#E7C86A" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="10" cy="20" r="1.5" fill="#E7C86A"/>
      <circle cx="18" cy="20" r="1.5" fill="#E7C86A"/>
    </symbol>

    <!-- Search -->
    <symbol id="tp-header-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5" fill="none" stroke="#E7C86A" stroke-width="2"/>
      <path d="M16.2 16.2L21 21" fill="none" stroke="#E7C86A" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Support (Envelope) -->
    <symbol id="tp-header-support" viewBox="0 0 24 24">
      <path d="M4 7h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"
            fill="none" stroke="#E7C86A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M22 9l-10 7L2 9"
            fill="none" stroke="#E7C86A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

  </defs>
</svg>
